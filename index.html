function render(){const id=location.hash.slice(1)||'home';document.querySelector('#nav').innerHTML=navItems.map(([key,label])=>`<button class="${key===id?'active':''}" onclick="navigate('${key}')">${label}</button>`).join('')+`<button class="nav-cta" onclick="navigate('planner')">Lên kế hoạch ↗</button>`;const app=document.querySelector('#app');const pages={home:homePage,places:()=>listingPage('Địa điểm du lịch','Những điểm đến nổi bật từ thiên nhiên đến di sản. Giá vé và giờ hoạt động được ghi rõ khi chưa xác minh.',places,'places'),food:()=>listingPage('Ăn uống Đà Lạt','Gợi ý điểm ăn uống được định danh; hãy xác nhận địa chỉ, giờ và menu trước khi đến.',eateries,'food'),stays:()=>listingPage('Khách sạn & lưu trú','Tìm cơ sở lưu trú, kiểm tra điều kiện và đặt qua kênh chính thức.',stays,'stays'),tours:toursPage,planner:plannerPage,map:mapPage,tips:tipsPage};app.innerHTML=(pages[id]||homePage)();if(id==='places'||id==='food'||id==='stays')setupFilters(id);if(id==='planner')setupPlanner();if(id==='map')setupMap()}
function homePage(){return `<section class="hero"><div class="hero-inner"><span class="eyebrow">Lâm Đồng · Việt Nam</span><h1>Khám phá Đà Lạt<br>thành phố ngàn hoa.</h1><p>Chậm lại giữa rừng thông, hồ nước và nhịp sống cao nguyên. Một cẩm nang thực tế để bạn tự chọn điểm đến và lên kế hoạch hợp lý.</p><div class="home-search"><input id="homeQuery" placeholder="Bạn muốn khám phá điều gì?" aria-label="Tìm địa điểm"><button class="button" onclick="homeSearch()">Tìm kiếm</button></div><button class="button light" onclick="navigate('places')">Khám phá ngay&nbsp; →</button></div></section><section class="container"><div class="split"><div><span class="eyebrow">Xin chào từ cao nguyên</span><h2 class="serif" style="font-size:38px">Một chuyến đi, thật nhiều Đà Lạt.</h2><p style="line-height:1.85;color:#657168">Từ những con dốc quanh co đến mặt hồ yên ả, Đà Lạt mời gọi bạn khám phá theo nhịp riêng. Lưu ý: giá vé và giờ dịch vụ thay đổi theo thời điểm. Chúng tôi không tự điền giá chưa được xác minh.</p><button class="button" onclick="navigate('planner')">Tạo lịch trình của tôi</button><div class="feature-list"><div class="feature"><b>🌲 Thiên nhiên</b><span>Hồ, rừng thông, đồi cao nguyên.</span></div><div class="feature"><b>☕ Nhịp phố</b><span>Cà phê, món địa phương và chợ.</span></div></div></div><img class="intro-photo" src="${photo('photo-1470770841072-f978cf4d019e',1000)}" alt="Phong cảnh hồ và núi minh họa cho cao nguyên Đà Lạt" loading="lazy"></div></section><section class="container" style="padding-top:0"><div class="section-heading"><div><span class="eyebrow">Bắt đầu khám phá</span><h2>Điểm đến được yêu thích</h2></div><button class="button outline" onclick="navigate('places')">Xem tất cả →</button></div><div class="card-grid">${places.slice(0,3).map((p,i)=>card(p,'places',i)).join('')}</div></section><section class="container" style="padding-top:0"><div class="notice"><strong>Minh bạch dữ liệu:</strong> Ảnh tại thẻ là ảnh minh họa phong cảnh/không gian, không đại diện ảnh xác thực của từng cơ sở. Giá và giờ chưa xác minh được ghi rõ; mở liên kết bản đồ để xác nhận địa chỉ trước khi khởi hành.</div></section>`}
function homeSearch(){const q=document.querySelector('#homeQuery').value.trim();navigate('places');setTimeout(()=>{const input=document.querySelector('#filterSearch');if(input){input.value=q;input.dispatchEvent(new Event('input'))}},80)}
function listingPage(title,desc,data,type){return `<section class="page-head"><span class="eyebrow">Cẩm nang Đà Lạt</span><h1>${title}</h1><p>${desc}</p></section><section class="container" style="padding-top:30px"><div class="notice"><strong>Thông tin có trách nhiệm:</strong> Giá/giờ chưa được xác minh trực tiếp được ghi là cần liên hệ, không phải giá hiện hành. Ảnh minh họa, không phải ảnh xác thực địa điểm. Địa chỉ và trạng thái hoạt động nên kiểm tra bằng bản đồ trước chuyến đi.</div><div class="filters"><input id="filterSearch" placeholder="Tìm tên, khu vực..." aria-label="Tìm kiếm"><select id="filterCategory"><option value="">Tất cả danh mục</option>${[...new Set(data.map(x=>x.category))].map(x=>`<option>${x}</option>`).join('')}</select><select id="filterArea"><option value="">Mọi khu vực</option>${[...new Set(data.map(x=>x.area.split(',')[0]))].map(x=>`<option>${x}</option>`).join('')}</select><button class="button outline" onclick="showFavorites('${type}')">♡ Đã lưu</button></div><div class="card-grid" id="listingGrid">${data.map((x,i)=>card(x,type,i)).join('')}</div></section>`}
function card(x,type,i){const key=`${type}:${x.name}`,saved=(JSON.parse(localStorage.getItem('dalat_favs')||'[]')).includes(key);const maps=`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(x.map)}`;return `<article class="card" data-name="${(x.name+' '+x.area).toLowerCase()}" data-category="${x.category}" data-area="${x.area.split(',')[0]}"><img src="${photo(x.img,800)}" alt="Ảnh minh họa: ${x.name}" loading="lazy"><div class="card-body"><span class="tag">${x.category}</span><h3>${x.name}</h3><p>⌖ ${x.area}</p><p>${x.detail}</p><p><b>Giá:</b> <span class="price">${x.price}</span></p><p><b>Giờ:</b> ${x.hours}</p><div class="card-actions"><a href="${x.url||maps}" target="_blank" rel="noopener">${x.url?'Website chính thức ↗':'Bản đồ & chỉ đường ↗'}</a><button class="favorite ${saved?'saved':''}" aria-label="Lưu ${x.name}" onclick="toggleFavorite('${key.replaceAll("'","\\'")}',this)">${saved?'♥':'♡'}</button></div>${type==='stays'?`<p class="small">Số điện thoại: không đăng khi chưa xác minh. So sánh: <label><input type="checkbox" onchange="compareStay('${x.name.replaceAll("'","\\'")}',this)"> Thêm so sánh</label></p>`:''}</div></article>`}
function setupFilters(type){const data={places,food:eateries,stays}[type];const update=()=>{const q=document.querySelector('#filterSearch').value.toLowerCase(),cat=document.querySelector('#filterCategory').value,area=document.querySelector('#filterArea').value;document.querySelectorAll('#listingGrid .card').forEach(c=>c.hidden=!(c.dataset.name.includes(q)&&(!cat||c.dataset.category===cat)&&(!area||c.dataset.area===area)))};document.querySelector('#filterSearch').addEventListener('input',update);document.querySelector('#filterCategory').addEventListener('change',update);document.querySelector('#filterArea').addEventListener('change',update)}
function toggleFavorite(key,btn){let f=JSON.parse(localStorage.getItem('dalat_favs')||'[]');if(f.includes(key))f=f.filter(x=>x!==key);else f.push(key);localStorage.setItem('dalat_favs',JSON.stringify(f));btn.classList.toggle('saved');btn.textContent=f.includes(key)?'♥':'♡';toast(f.includes(key)?'Đã lưu vào mục yêu thích':'Đã bỏ khỏi mục yêu thích')}
function showFavorites(type){const f=JSON.parse(localStorage.getItem('dalat_favs')||'[]');document.querySelectorAll('#listingGrid .card').forEach(c=>{const key=type+':'+c.querySelector('h3').textContent;c.hidden=!f.includes(key)})}
function toursPage(){const ts=[['Một ngày giữa phố & hồ','1 ngày','Dành cho chuyến ghé ngắn: chọn 2–3 điểm gần nhau, dành thời gian nghỉ và ăn uống.','Lịch trình gợi ý, không phải tour bán sẵn. Tự xác nhận vé và phương tiện.'],['Đà Lạt thong thả','2 ngày 1 đêm','Ngày 1: khu trung tâm, hồ Xuân Hương, quảng trường. Ngày 2: chọn Thiền viện Trúc Lâm và hồ Tuyền Lâm.','Lưu trú, ăn uống và vé không bao gồm; chi phí phụ thuộc lựa chọn.'],['Cao nguyên & trải nghiệm','3 ngày 2 đêm','Ngày 1: trung tâm. Ngày 2: chọn Langbiang hoặc Thung lũng Tình Yêu. Ngày 3: khu Trại Mát hoặc Cầu Đất.','Kiểm tra khoảng cách, thời tiết và giờ vận hành trước khi sắp xếp.'],['Nghỉ dưỡng chậm','4 ngày 3 đêm','Kết hợp điểm tham quan trung tâm, một ngày thiên nhiên, một ngày nghỉ tại nơi lưu trú đã đặt.','Phương tiện, phòng và vé tự đặt; không có đối tác/tour bán trực tiếp trên website.'],['Tiết kiệm & tự túc','Linh hoạt','Ưu tiên điểm công cộng và gom điểm theo khu vực; xác minh phí phát sinh, dùng phương tiện phù hợp.','Không cam kết mức ngân sách do giá dịch vụ thay đổi.'],['Nghỉ dưỡng & check-in','Linh hoạt','Chọn lưu trú có kênh đặt chính thức, lên lịch ít điểm mỗi ngày và kiểm tra giờ chụp/di chuyển.','Ảnh trên website minh họa; không đại diện cơ sở lưu trú.']];return `<section class="page-head"><span class="eyebrow">Tự thiết kế hành trình</span><h1>Tour & lịch trình gợi ý</h1><p>Khung tham khảo theo số ngày, không phải tour thương mại. Chưa xác minh giá tour hoặc dịch vụ nên không đưa ra chi phí bịa đặt.</p></section><section class="container"><div class="notice"><strong>Chi phí:</strong> Vé, phòng và phương tiện phụ thuộc ngày đi và nhà cung cấp. Các gợi ý dưới đây không bao gồm dịch vụ đặt chỗ; hãy xác nhận trực tiếp trước khi thanh toán.</div><div class="card-grid">${ts.map((t,i)=>`<article class="card"><img src="${photo(['photo-1470770841072-f978cf4d019e','photo-1500530855697-b586d89ba3ee','photo-1464822759023-fed622ff2c3b'][i%3])}" alt="Ảnh minh họa cao nguyên" loading="lazy"><div class="card-body"><span class="tag">${t[1]}</span><h3>${t[0]}</h3><p>${t[2]}</p><p>${t[3]}</p><button class="button" onclick="navigate('planner')">Tùy chỉnh lịch trình</button></div></article>`).join('')}</div></section>`}
function plannerPage(){const opts=[...places,...eateries].map(x=>x.name);return `<section class="page-head"><span class="eyebrow">Cá nhân hóa chuyến đi</span><h1>Lập lịch trình của bạn</h1><p>Chọn ngày, nhóm điểm đến và ngân sách. Lịch được sắp xếp theo danh sách bạn chọn; chi phí chỉ tính phần bạn tự nhập.</p></section><section class="container"><div class="planner"><div class="panel"><h2>Thông tin chuyến đi</h2><div class="form-grid"><div class="field"><label for="startDate">Ngày bắt đầu</label><input type="date" id="startDate"></div><div class="field"><label for="endDate">Ngày kết thúc</label><input type="date" id="endDate"></div><div class="field"><label for="people">Số người</label><input type="number" id="people" min="1" value="2"></div><div class="field"><label for="budget">Ngân sách dự kiến (₫)</label><input type="number" id="budget" min="0" placeholder="Nhập ngân sách"></div><div class="field full"><label for="transport">Phương tiện dự kiến</label><select id="transport"><option>Chưa chọn</option><option>Đi bộ / phương tiện công cộng</option><option>Thuê xe máy (tự xác minh giá và điều kiện)</option><option>Taxi / xe công nghệ</option><option>Ô tô riêng / thuê xe</option></select></div><div class="field full"><label>Chọn điểm muốn đến</label><div class="checklist">${opts.map((x,i)=>`<label class="check-option"><input type="checkbox" name="dest" value="${x}" ${i<3?'checked':''}>${x}</label>`).join('')}</div></div><div class="field full"><label for="costs">Chi phí bạn đã xác minh (mỗi người, ₫; tùy chọn)</label><input type="number" id="costs" min="0" placeholder="Ví dụ: vé/hoạt động đã xác nhận"></div><div class="field full"><button class="button" onclick="generatePlan()">Tạo lịch trình</button></div></div></div><div class="panel" id="planResult"><h2>Hành trình của bạn</h2><p class="muted">Chọn ngày và điểm đến, sau đó nhấn “Tạo lịch trình”. Chúng tôi không tự ước tính các giá chưa xác minh.</p></div></div><div style="margin-top:18px"><button class="button outline" onclick="sharePlan()">Chia sẻ lịch trình ↗</button> <span class="small">Lưu/chia sẻ trên trình duyệt này; không gửi dữ liệu tới máy chủ.</span></div></section>`}
function setupPlanner(){const today=new Date().toISOString().slice(0,10);document.querySelector('#startDate').min=today;document.querySelector('#startDate').addEventListener('change',e=>document.querySelector('#endDate').min=e.target.value)}
function generatePlan(){const start=document.querySelector('#startDate').value,end=document.querySelector('#endDate').value;const selected=[...document.querySelectorAll('[name=dest]:checked')].map(e=>e.value);const people=Math.max(1,+document.querySelector('#people').value||1),per=+document.querySelector('#costs').value||0,budget=+document.querySelector('#budget').value||0;if(!start||!end||end<start){toast('Vui lòng chọn ngày hợp lệ.');return}if(!selected.length){toast('Hãy chọn ít nhất một điểm đến.');return}const days=Math.max(1,Math.round((new Date(end)-new Date(start))/86400000)+1),groups=Array.from({length:days},(_,i)=>selected.filter((_,j)=>j%days===i));const dateText=d=>new Date(d+'T12:00:00').toLocaleDateString('vi-VN',{weekday:'long',day:'numeric',month:'long'});document.querySelector('#planResult').innerHTML=`<h2>Hành trình ${days} ngày</h2><p><b>${dateText(start)} – ${dateText(end)}</b> · ${people} người · Phương tiện: ${document.querySelector('#transport').value}</p>${groups.map((g,i)=>`<div class="itinerary-day"><strong>Ngày ${i+1} · ${dateText(new Date(new Date(start+'T12:00:00').getTime()+i*86400000).toISOString().slice(0,10))}</strong><p>${g.length?g.join(' → '):'Dành thời gian nghỉ ngơi / di chuyển.'}</p><span class="small">Sắp xếp tự động theo danh sách; hãy kiểm tra khoảng cách và giờ mở cửa.</span></div>`).join('')}<hr style="border:0;border-top:1px solid var(--line)"><p><b>Chi phí đã nhập:</b> ${per?new Intl.NumberFormat('vi-VN').format(per*people)+' ₫ (tổng cho '+people+' người)':'Chưa có — nhập giá đã xác minh để tính.'}</p><p><b>Ngân sách:</b> ${budget?new Intl.NumberFormat('vi-VN').format(budget)+' ₫':'Chưa nhập'}</p><p class="small">Phép tính chỉ sử dụng chi phí bạn tự nhập, không bao gồm các khoản chưa biết như lưu trú, ăn uống, di chuyển và vé.</p>`;window.currentPlan=document.querySelector('#planResult').innerText;toast('Đã tạo lịch trình trên thiết bị của bạn.')}
function sharePlan(){if(!window.currentPlan){toast('Hãy tạo lịch trình trước.');return}if(navigator.share)navigator.share({title:'Lịch trình Đà Lạt',text:window.currentPlan}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(window.currentPlan).then(()=>toast('Đã sao chép lịch trình.'));else toast('Trình duyệt không hỗ trợ chia sẻ.')}
function mapPage(){return `<section class="page-head"><span class="eyebrow">Bản đồ khám phá</span><h1>Tìm đường quanh Đà Lạt</h1><p>Bản đồ nền OpenStreetMap. Chọn một gợi ý để mở chỉ đường; định vị và khoảng cách thực tế phụ thuộc thiết bị/dịch vụ bản đồ.</p></section><section class="container"><div class="filters"><select id="mapCategory"><option value="">Tất cả địa điểm</option><option>Thiên nhiên</option><option>Check-in</option><option>Tâm linh</option><option>Vui chơi</option><option>Ăn uống</option></select><select id="mapPlace"><option value="">Chọn điểm đến</option>${places.map(x=>`<option value="${x.map}">${x.name}</option>`).join('')}</select><button class="button" onclick="openDirections()">Chỉ đường ↗</button><button class="button outline" onclick="locateMe()">◎ Định vị</button></div><div class="map-wrap"><iframe title="Bản đồ Đà Lạt trên OpenStreetMap" loading="lazy" src="https://www.openstreetmap.org/export/embed.html?bbox=108.35%2C11.85%2C108.55%2C12.05&layer=mapnik&marker=11.9404%2C108.4583"></iframe></div><p class="small">Bản đồ nhúng hiển thị khu vực trung tâm; danh sách bên dưới mở chỉ đường từng điểm. Không thể đảm bảo trạng thái giao thông trực tiếp.</p><div class="card-grid" id="mapCards">${places.map((x,i)=>`<article class="card" data-category="${x.category}"><div class="card-body"><span class="tag">${x.category}</span><h3>${x.name}</h3><p>${x.area}</p><a class="text-link" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(x.map)}">Mở chỉ đường ↗</a></div></article>`).join('')}</div></section>`}
function setupMap(){document.querySelector('#mapCategory').addEventListener('change',e=>document.querySelectorAll('#mapCards .card').forEach(c=>c.hidden=!!e.target.value&&c.dataset.category!==e.target.value))}
function openDirections(){const v=document.querySelector('#mapPlace').value;if(!v){toast('Hãy chọn một địa điểm.');return}window.open('https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(v),'_blank','noopener')}
function locateMe(){if(!navigator.geolocation){toast('Thiết bị không hỗ trợ định vị.');return}navigator.geolocation.getCurrentPosition(p=>window.open(`https://www.google.com/maps/search/?api=1&query=${p.coords.latitude},${p.coords.longitude}`,'_blank','noopener'),()=>toast('Không thể lấy vị trí. Hãy cấp quyền định vị hoặc kiểm tra cài đặt.'))}
function tipsPage(){const tips=[['Thời điểm & thời tiết','Đà Lạt có thể mưa và lạnh thay đổi theo mùa, đặc biệt buổi tối và sáng sớm. Kiểm tra dự báo thời tiết gần ngày đi thay vì dựa vào một lịch mùa cố định.'],['Trang phục & sức khỏe','Mang áo khoác nhiều lớp, giày đi bộ có độ bám và đồ che mưa. Chuẩn bị thuốc cá nhân; cân nhắc địa hình dốc khi chọn hoạt động.'],['Thuê xe an toàn','Xác minh giấy tờ, điều kiện thuê, bảo hiểm và tình trạng xe; đội mũ bảo hiểm đạt chuẩn. Không lái xe nếu chưa quen đường đèo hoặc thời tiết xấu.'],['Đặt phòng thông minh','Ưu tiên website/kênh chính thức, kiểm tra tổng giá, thuế/phí, chính sách hủy và vị trí chính xác. Không chuyển tiền chỉ dựa trên bài đăng chưa xác thực.'],['Tham quan có trách nhiệm','Kiểm tra giờ và giá với đơn vị vận hành; hỏi giá trước ở quầy dịch vụ. Tôn trọng nơi thờ tự, không xả rác và tuân thủ hướng dẫn an toàn.'],['Ăn uống & đặc sản','Thử món địa phương theo khẩu vị; xem menu/giá và hỏi thành phần nếu có dị ứng. Các lựa chọn phổ biến gồm bánh căn, lẩu gà lá é và sản vật địa phương.']];return `<section class="page-head"><span class="eyebrow">Trước khi khởi hành</span><h1>Kinh nghiệm du lịch</h1><p>Một vài lưu ý thực tế giúp chuyến đi an toàn, linh hoạt và tránh phụ thuộc thông tin giá cũ.</p></section><section class="container"><div class="tips-grid">${tips.map((x,i)=>`<article class="tip"><span class="eyebrow">0${i+1} · Gợi ý</span><h3>${x[0]}</h3><p>${x[1]}</p></article>`).join('')}</div><div class="notice" style="margin-top:25px"><strong>Trường hợp khẩn cấp:</strong> Dùng số khẩn cấp chính thức tại Việt Nam và liên hệ cơ sở lưu trú/cơ quan địa phương. Nội dung này không thay thế tư vấn y tế hay thông tin an toàn chính thức.</div></section>`}
function compareStay(name,el){let a=JSON.parse(localStorage.getItem('dalat_compare')||'[]');if(el.checked){if(!a.includes(name))a.push(name)}else a=a.filter(x=>x!==name);localStorage.setItem('dalat_compare',JSON.stringify(a));toast(a.length?`Đang so sánh ${a.length} cơ sở đã chọn.`:'Đã xóa khỏi so sánh.')}
let toastTimer;function toast(s){const e=document.querySelector('#toast');e.textContent=s;e.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.classList.remove('show'),2500)}
window.addEventListener('hashchange',render);render();
</script>
</body></html>
